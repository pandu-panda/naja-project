<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Let’s Explore Report Text!</title>
    <style>

        .dots span{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--lb);margin:0 3px;border:2px solid var(--ink)}.dots .on{background:var(--c)}.dots .cur{background:var(--y);transform:scale(1.3)}

        .good{background:var(--g)!important;border-color:var(--ok)}.bad{background:var(--c)!important;border-color:var(--no)}.fb{padding:10px;border-radius:12px;background:var(--lb);font-weight:700}.fb.ok{border-left:8px solid var(--ok)}.fb.no{border-left:8px solid var(--no)}

        .nav{display:flex;justify-content:space-between;margin-top:12px}mark{background:var(--y);color:inherit;border-radius:6px;padding:0 3px}

        .sc{display:block;margin:6px 0;padding:12px;border-radius:14px;border:3px dashed var(--ink);background:var(--card);cursor:grab;min-height:44px}.sc.sel{background:var(--y);transform:scale(1.02)}.sc.ok{border-style:solid;border-color:var(--ok);cursor:default}.zone{min-height:110px;border:3px solid var(--ink);border-radius:16px;padding:10px;cursor:pointer}

        .in{width:100%;padding:10px;border:3px solid var(--ink);border-radius:12px;font:inherit;background:var(--card);color:var(--ink);margin:4px 0}.pg{display:flex;gap:10px;align-items:center;margin-bottom:8px}.pg .prog{flex:1}.dots .vis{background:var(--y)}.tm{height:8px;background:var(--lb);border-radius:6px;overflow:hidden;margin:4px 0}.tm i{display:block;height:100%;background:var(--c);transition:width 1s linear}
        @media(max-width:600px){.btn,.opt,.tile{min-height:44px}}
    </style></head><body><div id="app"></div>
        <script>
            const $=s=>document.querySelector(s),A=$('#app'),ORD=['menu','ice','out','auth','mat','games','end'],SEC=['ice','out','auth','mat','games'],NM={ice:'Ice Breaking',out:'Learning Outcomes',auth:'Authentic Materials',mat:'Materials of the Topic',games:'Interactive Games'};
            let mute=false,cur='menu',seen={};
            function snd(ok){if(mute)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=ok?'sine':'square';o.frequency.value=ok?700:220;o.frequency.setValueAtTime(ok?950:160,c.currentTime+.12);g.gain.value=.07;o.start();o.stop(c.currentTime+.3)}catch(e){}}

                A.innerHTML=`<div class="bar"><button class="btn" onclick="go('menu')">🏠 Home</button><span class="dots" title="Progress">${SEC.map(k=>`<span class="${k==par?'cur':seen[k]?'on':''}"></span>`).join('')}</span><button class="btn" id="mu" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">${mute?'🔇':'🔊'}</button></div><div class="card" id="body"></div>`+
(s=='menu'?'':`<div class="nav"><button class="btn c" onclick="go('${sub?'games':ORD[i-1]}')">◀ Back</button>${sub||s=='end'?'<span></span>':`<button class="btn g" onclick="go('${ORD[i+1]}')">Next ▶</button>`}</div>`)+'<footer>🌿 🐢 🦎 🌺 🦧 Grade IX - MTSN 2 KUDUS · Report Text</footer>';
SCR[s]();scrollTo(0,0)}
const msg=(s,n)=>s/n>=.8?'🏆 Excellent! You really understand Report Text!':s/n>=.5?'👍 Good job! Read the lesson again and try once more.':'💪 Keep practicing! You can do it.';
function quiz(id,qs,o={}){let i=0,sc=0;const Q=o.shuf?[...qs].sort(()=>Math.random()-.5):qs,el=$('#'+id);
function show(){const q=Q[i];el.innerHTML=`<div class="prog"><i style="width:${i/Q.length*100}%"></i></div><p class="sm">Question ${i+1} of ${Q.length} · Score: ${sc}</p>${q.pre||''}<h3>${q.q}</h3>`+q.o.map((t,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${t}</button>`).join('')+'<div id="fb"></div>';
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k==q.a;if(ok)sc++;snd(ok);el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=1;if(j==q.a)x.classList.add('good');else if(x===b)x.classList.add('bad')});
$('#fb').innerHTML=`<p class="fb ${ok?'ok':'no'}">${ok?'✅ Great job! ':'❌ Not quite. '}${q.e||''}</p><button class="btn" onclick="nx()">${i+1<Q.length?'Next question ▶':'See result'}</button>`})}
window.nx=()=>{i++;i<Q.length?show():el.innerHTML=o.end(sc,Q.length)};show()}
const end=(x='')=>(s,n)=>`<div class="big">${s/n>=.8?'🌟':s/n>=.5?'😊':'💪'}</div><h2>Score: ${s} / ${n}</h2><p>${msg(s,n)}</p>${x}<button class="btn" onclick="go(cur)">🔁 Play again</button>`;
const SCR={
menu(){const all=SEC.every(k=>k=='games'?seen.g1||seen.g2||seen.g3:seen[k]);$('#body').innerHTML=`<div style="text-align:center"><span class="guide">🦉</span><h1>Let’s Explore Report Text!</h1><div class="box" style="display:inline-block;max-width:100%;text-align:center;border:3px solid var(--ink);margin:6px 0 10px"><b>Report Text</b><br><span>Meicho Arya Henindra (2410510014)</span><br><span>Pandu Abdillah Nagari (2410510006)</span><br><span class="badge ad" style="margin-top:6px">Grade IX - MTSN 2 KUDUS</span></div><p>Hi! I’m Kiko the owl. Welcome! Choose a section and learn how to write facts about animals and plants.</p></div>${all?'<p class="fb ok">🎉 You visited every section. Well done, explorer!</p>':''}<div class="grid">${[['ice','🔍'],['out','🎯'],['auth','🌏'],['mat','📚'],['games','🎮']].map((k,n)=>`<button class="tile" onclick="go('${k[0]}')"><b>${k[1]}</b>${n+1}. ${NM[k[0]]}${seen[k[0]]?' ✅':''}</button>`).join('')}</div>`},
ice(){const I=[['🦎','Komodo Dragon',['I am a reptile.','I live in Indonesia.','I am the largest living lizard.','I use my tongue to smell.'],['Crocodile','Komodo Dragon','Iguana','Snake'],1],['🦧','Orangutan',['I am an ape.','I live in Sumatra and Borneo.','I have long arms and orange hair.','I eat fruit and leaves.'],['Monkey','Orangutan','Gorilla','Bear'],1],['🌺','Rafflesia',['I am a plant.','I grow in the forests of Sumatra and Borneo.','I am a very big flower.','I smell bad.'],['Rose','Sunflower','Rafflesia','Jasmine'],2],['🐢','Sea Turtle',['I live in the sea.','I have a hard shell.','I lay eggs on the beach.','I have flippers.'],['Crab','Dolphin','Frog','Sea Turtle'],3]];
$('#body').innerHTML=`<h2>🔍 Let’s Warm Up!</h2><p>Guess What I Am! Read the clues and choose the answer.</p><div id="q"></div>`;
quiz('q',I.map(x=>({pre:`<div class="big">❓</div><ul>${x[2].map(c=>`<li>${c}</li>`).join('')}</ul>`,q:'What am I?',o:x[3],a:x[4],e:`I am ${x[0]} ${x[1]}!`})),{end:end('<p class="fb ok">Great job! You have just described an animal using facts. Did you know that this is closely related to something called Report Text?</p><button class="btn g" onclick="go(\'out\')">Learn more ▶</button> ')})},
            out(){const L=[['🎯','Identify the social function of Report Text.'],['🧩','Recognize the generic structure.'],['🔤','Identify the language features.'],['📖','Understand facts from a simple Report Text.'],['🔎','Find specific information in a text.'],['✍️','Write a short Report Text about an animal, plant, or object.']];
                $('#body').innerHTML=`<h2>🎯 What Will We Learn Today?</h2><p>Today we learn how to read and write facts. By the end, you can:</p><div class="grid">${L.map((l,i)=>`<div class="box"><b style="font-size:2rem">${l[0]}</b><br><b>${i+1}.</b> ${l[1]}</div>`).join('')}</div><p class="sm">Your journey:</p><div class="prog"><i style="width:40%"></i></div><p class="sm">1 Ice Breaking ✔ → 2 Goals (you are here) → 3 Real texts → 4 Lesson → 5 Games</p>`},
auth(){const S=[['📚','Encyclopedia entries'],['🦎','Animal pages from zoos and wildlife groups'],['📰','National Geographic-style articles'],['🔬','Educational science articles'],['🏛️','Museum and nature information boards']];
$('#body').innerHTML=`<h2>🌏 Report Text in the Real World</h2><p>We find Report Text outside the classroom too:</p><div class="grid">${S.map(s=>`<div class="box">${s[0]} ${s[1]}</div>`).join('')}</div>
                <h3>Explore an Authentic Report!</h3><div class="pass"><div class="big">🦎🏝️</div><h3>The Komodo Dragon <i>(Varanus komodoensis)</i></h3><p><b>What is it?</b> The Komodo dragon is a <mark>large lizard</mark>. It is the <mark>largest living lizard</mark>.</p><p><b>Habitat:</b> It <mark>lives only on five small islands in Indonesia</mark>: Komodo, Rinca, Flores, Gili Motang and Gili Dasami.</p><p><b>Body:</b> It can grow up to <mark>3 metres</mark> long. It has strong legs, sharp claws, and a long tail. It has good eyes and a forked tongue.</p><p><b>Diet:</b> It <mark>eats deer, pigs, and other animals</mark>. It can eat a lot in one meal.</p><p><b>Behavior:</b> It uses its tongue to <mark>smell the air</mark>. It is a fast and strong hunter.</p><p class="sm">Adapted for students from facts in: <a href="https://nationalzoo.si.edu/animals/komodo-dragon" target="_blank" rel="noopener">Smithsonian’s National Zoo</a> · <a href="https://www.livescience.com/27402-komodo-dragons.html" target="_blank" rel="noopener">Live Science (cites Smithsonian and National Geographic)</a></p></div><div id="q" style="margin-top:12px"></div>`;
quiz('q',[{q:'What is the text mainly about?',o:['A funny story','The Komodo dragon','Indonesian food','A zoo trip'],a:1,e:'The text gives facts about the Komodo dragon.'},{q:'Where can Komodo dragons be found?',o:['On five islands in Indonesia','In every forest in Asia','Only in zoos in Europe','In the sea only'],a:0,e:'They live on Komodo, Rinca, Flores, Gili Motang and Gili Dasami.'},{q:'What do Komodo dragons eat?',o:['Only fruit','Grass','Deer, pigs and other animals','Only fish'],a:2,e:'They are meat eaters.'}],{end:end()})},
mat(t='A'){const T={A:'What?',B:'Function',C:'Structure',D:'Language',E:'Example',F:'Check'};
$('#body').innerHTML=`<h2>📚 Understanding Report Text</h2><div class="tabs">${Object.keys(T).map(k=>`<button class="btn ${k==t?'on':''}" onclick="SCR.mat('${k}')">${k}. ${T[k]}</button>`).join('')}</div><div id="m"></div>`;const m=$('#m');
if(t=='A')m.innerHTML=`<h3>A. What Is Report Text?</h3><div class="box">Report Text is a type of text that presents <b>factual information</b> about something in general, such as animals, plants, places, or natural phenomena.</div><p>Story: “A crab lost its shell.” ❌ <br>Report: “Crabs have ten legs.” ✅</p>`;
if(t=='B')m.innerHTML=`<h3>B. Social Function</h3><div class="box">Report Text gives <b>factual information</b> about something in general. The information comes from observation, research, or reliable sources.</div><p>📌 Purpose: to <b>inform</b>, not to tell a story or give an opinion.</p>`;
if(t=='C'){m.innerHTML=`<h3>C. Generic Structure</h3><p>Click each part.</p><div class="grid"><button class="tile" style="background:var(--g)" onclick="x(1)"><b>1️⃣</b>General Classification</button><button class="tile" style="background:var(--or)" onclick="x(2)"><b>2️⃣</b>Description</button></div><div class="box" id="xx">Title ➜ General Classification ➜ Description</div>`;window.x=n=>$('#xx').innerHTML=n==1?'<b>General Classification</b><br>Introduces and classifies the subject. It tells what the subject is in general.<br><i>“Cats are small mammals.”</i>':'<b>Description</b><br>Gives details: characteristics, habitat, behavior, parts, and other facts.<br><i>“Cats have sharp claws.”</i>'}
if(t=='D')m.innerHTML=`<h3>D. Language Features</h3><p>Click to open.</p><details><summary>1. Simple Present Tense</summary>We use it for facts. “They <b>live</b> on several Indonesian islands.”</details><details><summary>2. General Nouns</summary>Words for groups, not one special thing. “Komodo dragons are reptiles.”</details><details><summary>3. Technical Terms</summary>Special words about the topic: reptile, mammal, habitat, carnivore.</details><details><summary>4. Relating Verbs</summary>am/is/are/have link a subject to information. “Komodo dragons <b>are</b> reptiles.” “They <b>have</b> strong legs.”</details><details><summary>5. Action Verbs</summary>Show what the subject does. “They <b>eat</b> meat.”</details>`;
if(t=='E'){m.innerHTML=`<h3>E. Example: Cats 🐱</h3><p class="sm">Click a sentence or a <u data-e="Blue underline = language feature">blue word</u>. 🟩 General Classification · 🟧 Description · 🔵 Language feature</p><div class="pass"><span class="gc" data-e="General Classification: it tells what a cat is and which group it belongs to."><u data-e="General noun: ‘Cats’ means all cats, not one cat.">Cats</u> <u data-e="Relating verb in simple present: ‘are’ links ‘Cats’ to the information.">are</u> small <u data-e="Technical term: a mammal is an animal group.">mammals</u> that belong to the Felidae family.</span> <span class="gc" data-e="General Classification: more general information about the subject.">They are commonly kept as pets in many parts of the world.</span><br><br><span class="ds" data-e="Description: tells about the cat’s body.">Cats <u data-e="Relating verb in simple present: ‘have’ gives the parts or features.">have</u> soft fur, sharp claws, and excellent night vision.</span> <span class="ds" data-e="Description: more details about the body.">They have four legs and a long tail.</span> <span class="ds" data-e="Description: tells about diet. ‘eat’ is an action verb in simple present."><u data-e="Technical term: carnivorous means meat-eating.">Cats are carnivorous</u> animals that <u data-e="Action verb in simple present: shows what cats do.">eat</u> meat.</span> <span class="ds" data-e="Description: tells about behavior.">They <u data-e="Action verb in simple present.">communicate</u> through sounds and body movements.</span></div><div class="box" id="ex">👆 Click to see an explanation.</div>`;m.onclick=e=>{const t=e.target.closest('[data-e]');if(t&&t.parentNode.id!='x'){$('#ex').innerHTML='💡 '+t.dataset.e;snd(1)}}}
if(t=='F'){m.innerHTML='<h3>F. Check Your Understanding</h3><div id="q"></div>';quiz('q',[{q:'What is the social function of Report Text?',o:['To tell a funny story','To give facts about something in general','To ask people to buy things','To give steps'],a:1,e:'Report Text gives facts.'},{q:'“Lions are big cats that live in Africa.” Which part is it?',o:['General Classification','Description','Title','Opinion'],a:0,e:'It introduces and classifies lions.'},{q:'Which sentence is in the simple present tense?',o:['The cat jumped.','The cat is sleeping now.','The cat sleeps all day.','The cat will sleep.'],a:2,e:'“sleeps” is a simple present verb for a fact.'},{q:'Which sentence is a FACT?',o:['Cats are the cutest animals.','Cats have four legs.','Dogs are better than cats.','Everyone loves cats.'],a:1,e:'You can check this. The others are opinions.'}],{end:end()})}},
games(){$('#body').innerHTML=`<h2>🎮 Let’s Play and Learn!</h2><div class="grid"><button class="tile" onclick="go('g1')"><b>🕵️</b>Game 1: Structure Detective</button><button class="tile" onclick="go('g2')"><b>🔤</b>Game 2: Word Hunter</button><button class="tile" onclick="go('g3')"><b>🏆</b>Game 3: Report Text Challenge</button></div>`},
g1(){const S=[['Sumatran tigers are big cats from Indonesia.',0],['They have orange fur with black stripes.',1],['They eat deer and wild pigs.',1],['The Sumatran tiger is a rare type of big cat.',0],['They live in forests and swim very well.',1],['Tigers are mammals.',0]];let sc=0,d=0;
$('#body').innerHTML=`<h2>🕵️ Structure Detective</h2><p>Is each sentence a <b>General Classification</b> or a <b>Description</b>?</p><p class="sm" id="s">Score: 0 / 6</p>`+S.map((s,i)=>`<div class="box" id="r${i}">${s[0]}<br><button class="btn g" onclick="c(${i},0)">General Classification</button> <button class="btn" onclick="c(${i},1)">Description</button><span id="f${i}"></span></div>`).join('')+'<div id="fin"></div>';
window.c=(i,v)=>{const ok=v==S[i][1];snd(ok);if(ok)sc++;d++;$('#r'+i).querySelectorAll('button').forEach(b=>b.disabled=1);$('#f'+i).innerHTML=ok?' ✅ Correct!':` ❌ It is ${S[i][1]?'a Description (a detail)':'General Classification (what it is)'}.`;$('#s').textContent=`Score: ${sc} / 6`;if(d==6)$('#fin').innerHTML=`<p class="fb ok">${msg(sc,6)}</p><button class="btn" onclick="go('g1')">🔁 Play again</button>`}},
g2(){const TX='Rabbits are small animals. They live in burrows. They eat grass and carrots. A rabbit has long ears and strong back legs. Rabbits run fast and jump high.',K={rabbits:'n',animals:'n',burrows:'n',grass:'n',carrots:'n',ears:'n',legs:'n',rabbit:'n',are:'r',has:'r',live:'a',eat:'a',run:'a',jump:'a'},N={n:'General noun',r:'Relating verb',a:'Action verb'};let sel='n',as={};
$('#body').innerHTML=`<h2>🔤 Word Hunter</h2><p>Pick a type, then click words in the text. Click again to remove. Press Check.</p><div class="tabs"><button class="btn on" data-t="n">🔵 General noun</button><button class="btn" data-t="r">🟠 Relating verb</button><button class="btn" data-t="a">🟢 Action verb</button></div><div class="pass" id="t">${TX.split(' ').map(w=>{const k=w.toLowerCase().replace(/[^a-z]/g,'');return `<span class="w" data-k="${k}">${w}</span>`}).join(' ')}</div><p><button class="btn c" id="ck">✔ Check</button></p><div id="res"></div>`;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b))});
